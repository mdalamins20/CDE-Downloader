name: Build Desktop Apps (Win, Mac, Linux)

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r desktop_app/api/requirements.txt
    - name: Build with PyInstaller
      run: python build.py
    - name: Rename and Zip for Windows
      run: |
        Rename-Item -Path "dist\app" -NewName "CDE-Windows"
        Compress-Archive -Path "dist\CDE-Windows" -DestinationPath "dist\CDE-Windows-Portable.zip"
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CDE-Windows-Portable
        path: dist/CDE-Windows-Portable.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk fakeroot dpkg-dev
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r desktop_app/api/requirements.txt
    - name: Build with PyInstaller
      run: python build.py
    - name: Create Debian Package
      run: python create_deb.py
    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CDE-Linux-Installer
        path: "*.deb"

  build-mac:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r desktop_app/api/requirements.txt
    - name: Build with PyInstaller
      run: python build.py
    - name: Zip Mac App
      run: |
        cd dist
        zip -r CDE-MacOS-App.zip app.app
    - name: Upload Mac Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CDE-MacOS-App
        path: dist/CDE-MacOS-App.zip
